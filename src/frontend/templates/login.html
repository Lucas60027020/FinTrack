{% extends "base.html" %}

{% block content %}
<div class="auth-card">
    <div class="brand large">Fin<span>Track</span></div>
    <p class="eyebrow">PERSONAL FINANCE PLATFORM</p>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to manage your finances.</p>

    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@example.com" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Your password" required>

        <button type="submit">Sign In</button>
    </form>

    <p class="switch">
        Don't have an account?
        <a href="{{ url_for('register') }}">Create one</a>
    </p>
</div>
{% endblock %}
